name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Smoke test
        run: |
          node bin/objstore.js encode examples/hello.txt --k 4 --m 2 && node bin/objstore.js demo && node bin/objstore.js durability && node bin/objstore.js bench --mb 8
